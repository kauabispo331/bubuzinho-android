name: Gerar APK do Bubuzinho

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android completo
        run: unzip -o bubuzinho-apk.zip -d build

      - name: Gerar APK de debug
        working-directory: build/bubuzinho-apk
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: bubuzinho-apk-debug
          path: build/bubuzinho-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
